name: iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ios-build.yml"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build & upload signed iOS app to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    env:
      # Backend URL baked into the production React build.
      # Override by setting REACT_APP_BACKEND_URL in repo Secrets.
      REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL || 'https://sacoparentsapp.online' }}
      # Capacitor app metadata (must match capacitor.config.ts)
      APP_BUNDLE_ID: com.bsossi.sacoparents
      SCHEME: App
      CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Select Xcode version
        run: |
          # macos-14 runners ship with Xcode 15.x; pick latest stable
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || \
            true
          xcodebuild -version

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build React production bundle
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build

      - name: Generate iOS platform (idempotent) + apply patches
        working-directory: frontend
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          # Apply our Info.plist patches (encryption exemption + routing strip)
          yarn cap:ios:patch

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios/App
        run: |
          pod install --repo-update

      - name: Inject build number from GitHub run number
        working-directory: frontend/ios/App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Use the GitHub Actions run number as the CFBundleVersion so every
          # TestFlight upload has a unique build number (Apple rejects duplicates)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD_NUMBER" App/Info.plist
          echo "Versioned: CFBundleVersion=$BUILD_NUMBER, CFBundleShortVersionString=1.0.$BUILD_NUMBER"

      - name: Set up code signing
        if: env.SIGNING_READY == 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode .p12 distribution certificate
          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          # Decode mobileprovision file
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Create temporary keychain + import certificate
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Surface the UUID for the next step
          PROFILE_UUID=$(grep -aA1 UUID $PROFILE_PATH | grep -o "[-A-F0-9]\{36\}")
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Provisioning profile UUID: $PROFILE_UUID"

      - name: Build & archive iOS app
        if: env.SIGNING_READY == 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        working-directory: frontend/ios/App
        run: |
          ARCHIVE_PATH=$RUNNER_TEMP/App.xcarchive
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath $ARCHIVE_PATH \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive | xcpretty
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV

      - name: Export signed IPA
        if: env.SIGNING_READY == 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        working-directory: frontend/ios/App
        run: |
          EXPORT_DIR=$RUNNER_TEMP/export
          EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist
          cat > $EXPORT_OPTIONS <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $ARCHIVE_PATH \
            -exportPath $EXPORT_DIR \
            -exportOptionsPlist $EXPORT_OPTIONS | xcpretty
          IPA=$(find $EXPORT_DIR -name "*.ipa" | head -1)
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          ls -lh $EXPORT_DIR

      - name: Upload IPA to App Store Connect (TestFlight)
        if: env.SIGNING_READY == 'true' && env.HAS_API_KEY == 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p $KEY_DIR
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > $KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      - name: Upload IPA as workflow artifact (always)
        if: env.SIGNING_READY == 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sa-coparents-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: No signing secrets — produce build log only
        if: env.SIGNING_READY != 'true'
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          echo "::warning::No iOS signing secrets set yet. See memory/IOS_BUILD_GUIDE.md to configure: IOS_BUILD_CERTIFICATE_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_KEYCHAIN_PASSWORD, IOS_TEAM_ID, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64. Build will not produce an IPA until these are added."
          echo "## iOS build not signed" >> $GITHUB_STEP_SUMMARY
          echo "Add the 8 iOS signing secrets to enable .ipa generation." >> $GITHUB_STEP_SUMMARY
          echo "See memory/IOS_BUILD_GUIDE.md for the one-time setup." >> $GITHUB_STEP_SUMMARY

      - name: Build summary
        if: always()
        env:
          SIGNING_READY: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
        run: |
          echo "## iOS build summary" >> $GITHUB_STEP_SUMMARY
          if [ "$SIGNING_READY" = "true" ]; then
            echo "- Signed IPA produced and available in Artifacts" >> $GITHUB_STEP_SUMMARY
            if [ "$HAS_API_KEY" = "true" ]; then
              echo "- IPA uploaded to TestFlight via App Store Connect API" >> $GITHUB_STEP_SUMMARY
              echo "- Wait ~10-15 min, then check TestFlight in App Store Connect" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Download IPA from Artifacts below" >> $GITHUB_STEP_SUMMARY
              echo "- Upload manually via Transporter app or App Store Connect" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- No signing — see warning above" >> $GITHUB_STEP_SUMMARY
          fi
