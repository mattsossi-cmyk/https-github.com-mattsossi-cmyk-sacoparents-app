<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BFC poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #3D1A78 0%, #5E2DB5 45%, #2DB5B5 100%);
      color: #fff;
      position: relative;
    }
    .blob-a {
      position: absolute; top: -160px; right: -160px; width: 460px; height: 460px;
      border-radius: 999px; background: rgba(255,255,255,0.10); filter: blur(60px);
    }
    .blob-b {
      position: absolute; bottom: -180px; left: -180px; width: 500px; height: 500px;
      border-radius: 999px; background: rgba(45,181,181,0.40); filter: blur(60px);
    }
    .wrap {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 64px;
    }
    .head { text-align: center; flex-shrink: 0; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,0.18);
      font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
    }
    .script {
      font-family: 'Caveat', cursive; color: #A8E8E8; margin: 14px 0 8px;
    }
    h1 {
      font-weight: 800; letter-spacing: -0.02em; line-height: 1.04;
    }
    h1 .accent { color: #A8E8E8; }
    .columns {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 28px;
      flex: 1; align-items: stretch;
      margin-top: 40px;
    }
    .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .phone {
      width: 100%; aspect-ratio: 9 / 19;
      border-radius: 36px;
      background: #1A1330;
      padding: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.18);
      position: relative;
    }
    .screen {
      width: 100%; height: 100%; border-radius: 28px;
      overflow: hidden;
      background: #F8F7FC; color: #1A1330;
      display: flex; flex-direction: column;
    }
    .notch {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 56px; height: 14px; border-radius: 999px; background: #1A1330; z-index: 2;
    }
    .screen-head {
      background: linear-gradient(135deg, #3D1A78, #5E2DB5 50%, #2DB5B5);
      color: #fff; padding: 30px 16px 14px;
    }
    .step-label {
      font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
      opacity: 0.85; margin-bottom: 2px;
    }
    .step-title { font-size: 13px; font-weight: 800; line-height: 1.18; }
    .items { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px solid #E5E0EE;
      border-radius: 12px; padding: 8px 9px;
    }
    .dot {
      width: 26px; height: 26px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 11px; flex-shrink: 0;
    }
    .dot.purple { background: linear-gradient(135deg, #4A1E9E, #7C3AED); }
    .dot.teal { background: linear-gradient(135deg, #2DB5B5, #4DD0D0); }
    .dot.magenta { background: linear-gradient(135deg, #B71F70, #D63A8A); }
    .item .label { font-size: 11px; font-weight: 700; color: #1A1330; line-height: 1.2; }
    .caption {
      font-size: 14px; font-weight: 700; opacity: 0.92;
      text-align: center;
    }
    .foot {
      flex-shrink: 0; margin-top: 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }
    .brand .name { font-size: 18px; font-weight: 800; }
    .brand .name .saco {
      background: linear-gradient(90deg, #A8E8E8, #fff);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .url { font-size: 14px; font-weight: 700; opacity: 0.88; }

    /* === SIZE VARIANTS === */
    /* Square 1080x1080 */
    body.sq { width: 1080px; height: 1080px; }
    body.sq h1 { font-size: 56px; }
    body.sq .badge { font-size: 14px; padding: 8px 18px; }
    body.sq .script { font-size: 34px; }
    body.sq .columns { gap: 24px; margin-top: 28px; }
    body.sq .step-title { font-size: 14px; }
    body.sq .item .label { font-size: 11.5px; }

    /* Portrait 1080x1350 */
    body.po { width: 1080px; height: 1350px; }
    body.po h1 { font-size: 62px; }
    body.po .badge { font-size: 14px; padding: 8px 18px; }
    body.po .script { font-size: 36px; }
    body.po .columns { gap: 26px; margin-top: 34px; }

    /* Landscape 1200x630 */
    body.la { width: 1200px; height: 630px; }
    body.la .wrap { padding: 40px 56px; flex-direction: row; gap: 40px; align-items: center; }
    body.la .head { text-align: left; flex: 0 0 360px; }
    body.la .columns { margin-top: 0; flex: 1; gap: 18px; }
    body.la h1 { font-size: 42px; }
    body.la .badge { font-size: 11px; padding: 5px 12px; }
    body.la .script { font-size: 26px; margin: 10px 0 6px; }
    body.la .phone { aspect-ratio: 9 / 16; }
    body.la .step-title { font-size: 11px; }
    body.la .step-label { font-size: 8px; }
    body.la .items { padding: 8px 7px; gap: 5px; }
    body.la .item { padding: 5px 6px; gap: 6px; border-radius: 9px; }
    body.la .dot { width: 18px; height: 18px; font-size: 8px; }
    body.la .item .label { font-size: 8.5px; line-height: 1.15; }
    body.la .caption { font-size: 11px; }
    body.la .foot { display: none; }
    body.la .url-mini {
      position: absolute; bottom: 18px; right: 28px; z-index: 3;
      font-size: 13px; font-weight: 800; opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="wrap" id="wrap"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const size = params.get('size') || 'sq';
    document.body.classList.add(size);

    const columns = [
      {
        step: 'Step 1', stepLabel: 'Step 1 · Assess',
        caption: 'Where you start',
        items: [
          { tone: 'purple', label: 'Separate facts from feelings' },
          { tone: 'teal',   label: 'Identify what you can and cannot control' },
          { tone: 'magenta',label: 'Evaluate patterns, not isolated events' },
        ]
      },
      {
        step: 'Step 2', stepLabel: 'Step 2 · Build',
        caption: 'What you build',
        items: [
          { tone: 'purple', label: 'State Goals, Issues & Concerns' },
          { tone: 'teal',   label: 'Begin Co-Parenting Statement' },
          { tone: 'magenta',label: 'Create Mediation Plan' },
        ]
      },
      {
        step: 'Step 3', stepLabel: 'Step 3 · Walk in',
        caption: 'What you take to mediation',
        items: [
          { tone: 'purple', label: 'Share Goals and Concerns' },
          { tone: 'teal',   label: 'Create Co-Parenting Statements' },
          { tone: 'magenta',label: 'Problem Solve' },
        ]
      },
    ];

    const colHTML = columns.map(c => `
      <div class="phone-wrap">
        <div class="phone">
          <div class="notch"></div>
          <div class="screen">
            <div class="screen-head">
              <div class="step-label">${c.stepLabel}</div>
              <div class="step-title">${c.caption}</div>
            </div>
            <div class="items">
              ${c.items.map(i => `
                <div class="item">
                  <span class="dot ${i.tone}">♥</span>
                  <span class="label">${i.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
        <div class="caption">${c.caption}</div>
      </div>
    `).join('');

    const isLandscape = size === 'la';
    document.getElementById('wrap').innerHTML = `
      <div class="head">
        <div class="badge">A glimpse</div>
        <div class="script">A glimpse inside the app</div>
        <h1>Built for calm,<br/><span class="accent">not conflict.</span></h1>
      </div>
      <div class="columns">${colHTML}</div>
      ${isLandscape ? '' : `
        <div class="foot">
          <div class="brand">
            <img src="/saco-hero-logo.jpg" alt=""/>
            <div class="name"><span class="saco">SA</span> Coparents</div>
          </div>
          <div class="url">sacoparentsapp.online</div>
        </div>
      `}
      ${isLandscape ? '<div class="url-mini">sacoparentsapp.online</div>' : ''}
    `;
  </script>
</body>
</html>
