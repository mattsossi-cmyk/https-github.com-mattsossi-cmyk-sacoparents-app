<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OG</title>
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #3D1A78 0%, #5E2DB5 45%, #2DB5B5 100%);
      color: #fff;
      position: relative;
    }
    .blob-a {
      position: absolute; top: -120px; right: -120px; width: 460px; height: 460px;
      border-radius: 999px; background: rgba(255,255,255,0.10); filter: blur(40px);
    }
    .blob-b {
      position: absolute; bottom: -140px; left: -140px; width: 460px; height: 460px;
      border-radius: 999px; background: rgba(45,181,181,0.45); filter: blur(40px);
    }
    .wrap {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      height: 100%; padding: 70px 80px;
    }
    .left { max-width: 680px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.18);
      font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
    }
    .script {
      font-family: 'Caveat', cursive;
      font-size: 36px; color: #A8E8E8; margin-top: 18px;
    }
    h1 {
      font-size: 70px; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em;
      margin-top: 4px;
    }
    h1 .accent { color: #A8E8E8; }
    p.sub {
      margin-top: 24px; font-size: 22px; line-height: 1.4; color: rgba(255,255,255,0.88);
      max-width: 620px;
    }
    .meta {
      margin-top: 36px; display: flex; gap: 24px; flex-wrap: wrap;
      font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.85);
    }
    .meta span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: #A8E8E8; display: inline-block; }
    .right {
      width: 360px; height: 360px; border-radius: 36px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 30px 60px rgba(0,0,0,0.25), 0 0 0 4px rgba(255,255,255,0.25);
      padding: 14px; display: flex; align-items: center; justify-content: center;
    }
    .right img {
      width: 100%; height: 100%; border-radius: 24px; object-fit: cover;
    }
    .wordmark {
      position: absolute; bottom: 36px; right: 80px; z-index: 2;
      font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
      color: rgba(255,255,255,0.92);
    }
    .wordmark .saco {
      background: linear-gradient(90deg, #A8E8E8, #fff);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="wrap">
    <div class="left">
      <div class="badge">✦ Introducing SA CoParents</div>
      <div class="script">Helping families</div>
      <h1>
        Smarter Communication.<br/>
        <span class="accent">Healthier Co-Parenting.</span>
      </h1>
      <p class="sub">A modern co-parenting platform that reduces conflict, improves communication, and keeps children at the center of every decision.</p>
      <div class="meta">
        <span><i class="dot"></i> Free to use</span>
        <span><i class="dot"></i> Private by default</span>
        <span><i class="dot"></i> No ads</span>
      </div>
    </div>
    <div class="right">
      <img src="/saco-hero-logo.jpg" alt=""/>
    </div>
  </div>
  <div class="wordmark"><span class="saco">SA</span> CoParents · sacoparentsapp.online</div>
</body>
</html>
