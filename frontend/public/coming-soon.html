<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Coming soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #3D1A78 0%, #5E2DB5 45%, #2DB5B5 100%);
      color: #fff;
      position: relative;
    }
    .blob-a {
      position: absolute; top: -160px; right: -160px; width: 520px; height: 520px;
      border-radius: 999px; background: rgba(255,255,255,0.10); filter: blur(60px);
    }
    .blob-b {
      position: absolute; bottom: -200px; left: -200px; width: 580px; height: 580px;
      border-radius: 999px; background: rgba(45,181,181,0.42); filter: blur(60px);
    }
    .wrap {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 56px 80px;
      gap: 56px;
    }
    .left { max-width: 640px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,0.18);
      font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
    }
    .script { font-family: 'Caveat', cursive; font-size: 38px; color: #A8E8E8; margin: 16px 0 4px; line-height: 1; }
    h1 {
      font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.04;
    }
    h1 .accent { color: #A8E8E8; }
    .sub {
      margin-top: 22px; font-size: 20px; line-height: 1.4; color: rgba(255,255,255,0.92);
      max-width: 560px;
    }
    .stores {
      margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap;
    }
    .store {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-radius: 18px; background: #0F0A1F;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }
    .store .icon { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; }
    .store .icon svg { width: 100%; height: 100%; }
    .store .label-top { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.78; font-weight: 700; }
    .store .label-main { font-size: 19px; font-weight: 800; line-height: 1.05; margin-top: 2px; }
    .right {
      flex-shrink: 0;
      width: 320px; height: 320px; border-radius: 32px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 30px 60px rgba(0,0,0,0.30), 0 0 0 6px rgba(255,255,255,0.18);
      padding: 14px;
    }
    .right img {
      width: 100%; height: 100%; border-radius: 22px; object-fit: cover;
    }
    .footer {
      position: absolute; bottom: 24px; right: 80px; z-index: 3;
      font-size: 15px; font-weight: 800; opacity: 0.88;
    }
    .footer .saco {
      background: linear-gradient(90deg, #A8E8E8, #fff);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* SIZE VARIANTS */
    body.fb { width: 1200px; height: 630px; }
    body.sq { width: 1080px; height: 1080px; }
    body.sq .wrap { flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px; gap: 36px; }
    body.sq .left { max-width: 880px; }
    body.sq h1 { font-size: 76px; }
    body.sq .sub { margin-left: auto; margin-right: auto; font-size: 26px; max-width: 720px; }
    body.sq .stores { justify-content: center; }
    body.sq .right { width: 280px; height: 280px; }
    body.sq .footer { left: 0; right: 0; text-align: center; }
    body.st { width: 1080px; height: 1920px; }
    body.st .wrap { flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 80px; gap: 48px; }
    body.st .left { max-width: 880px; }
    body.st h1 { font-size: 92px; }
    body.st .script { font-size: 56px; }
    body.st .sub { font-size: 30px; max-width: 800px; margin-left: auto; margin-right: auto; }
    body.st .stores { justify-content: center; flex-direction: column; align-items: stretch; max-width: 520px; margin-left: auto; margin-right: auto; }
    body.st .store { padding: 22px 32px; border-radius: 24px; }
    body.st .store .icon { width: 52px; height: 52px; }
    body.st .store .label-main { font-size: 28px; }
    body.st .store .label-top { font-size: 12px; }
    body.st .right { width: 360px; height: 360px; }
    body.st .footer { left: 0; right: 0; text-align: center; font-size: 22px; bottom: 50px; }
  </style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="wrap" id="wrap"></div>
  <div class="footer"><span class="saco">SA</span> CoParents · sacoparentsapp.online</div>

  <script>
    const sz = (new URLSearchParams(location.search).get('size') || 'fb').toLowerCase();
    document.body.classList.add(sz);

    document.getElementById('wrap').innerHTML = `
      <div class="left">

            </div>
            <div>
              <div class="label-top">Coming soon</div>
              <div class="label-main">App Store</div>
            </div>
          </div>
          <div class="store" aria-label="Coming soon to Google Play">
            <div class="icon">

                <defs>

                  </linearGradient>
                </defs>
                <path d="M3 2.5v19l10-9.5z" fill="url(#gpA)"/>
                <path d="M3 2.5l16.5 9.5L17 14.4 3 21.5z" fill="url(#gpB)" opacity="0"/>
                <path d="M3 21.5l10-9.5 3.5 3.4z" fill="url(#gpC)"/>
                <path d="M3 2.5l10 9.5L16.5 8.6z" fill="url(#gpD)"/>
                <path d="M16.5 8.6L20.4 11c.9.5.9 1.9 0 2.4l-3.9 2.4-3.5-3.4z" fill="url(#gpB)"/>
              </svg>
            </div>
            <div>
              <div class="label-top">Coming soon</div>
              <div class="label-main">Google Play</div>
            </div>
          </div>
        </div>
      </div>
      <div class="right">
        <img src="/saco-hero-logo.jpg" alt=""/>
      </div>
    `;
  </script>
</body>
</html>
