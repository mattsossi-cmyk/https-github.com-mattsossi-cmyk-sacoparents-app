                <h1 style="font-size:2rem;color:#1A1330;margin:0 0 8px 0">SA CoParents — With Reflection. Build Alignment. Create Better Agreements.</h1>
                <p style="font-size:1.15rem;color:#4B4567;margin:0 0 24px 0">
                    SA CoParents helps parents independently identify their child&rsquo;s needs, concerns and parenting priorities, discover areas of shared understanding, identify differences without assigning blame, and explore options and resources for moving forward.
                </p>
                <p>
                    SA CoParents helps separated and divorced parents prepare for
                    child-centered mediation. Through personalized assessments and
                    downloadable reports, parents move from emotionally reactive
                    to ready — with clarity, confidence, and purpose.
                </p>
                <h2 style="color:#3D1A78;margin-top:32px">What you can do with SA CoParents</h2>
                <ul>
                    <li><strong>Mediation Readiness Assessment</strong> — build a child-centered agenda and download a PDF summary for your mediator.</li>
                    <li><strong>Special Needs Assessment</strong> — 7-domain evaluation with a Consistency-Between-Homes score and a 6-part care plan.</li>
                    <li><strong>Family Violence &amp; Communication Safety Assessment</strong> — private screen that recommends the safest communication pathway and surfaces Texas crisis resources.</li>
                    <li><strong>AI Coach</strong> — child-centered guidance for reframing difficult messages, all constrained from clinical or legal advice.</li>
                    <li><strong>Longitudinal growth tracking</strong> — see your progress over time and share progress with your co-parent, mediator, or pediatrician.</li>
                </ul>
                <h2 style="color:#3D1A78;margin-top:32px">Built with trust in mind</h2>
                <ul>
                    <li>Created by Matt Sossi, Founder of SA CoParents, in San Antonio, Texas.</li>
                    <li>Your answers are never sold or used to train AI models.</li>
                    <li>You can delete your account and all data any time.</li>
                    <li>Full <a href="/methodology" style="color:#3D1A78">methodology</a> and <a href="/privacy" style="color:#3D1A78">privacy policy</a> are publicly published.</li>
                </ul>
                <h2 style="color:#3D1A78;margin-top:32px">Not a substitute for professional help</h2>
                <p>
                    SA CoParents is an educational and preparation tool. It is not
                    legal advice, therapy, or a substitute for professional
                    mediation. Always consult qualified family-law and
                    mental-health professionals for your situation.
                </p>
