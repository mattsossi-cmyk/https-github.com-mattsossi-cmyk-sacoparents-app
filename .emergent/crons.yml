crons:
  - name: completion-nudge
    description: "Emails parents when their co-parent completes their half, and both parents when a Joint Report is ready"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/completion-nudge"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: expiry-digest
    description: "Daily 8am Central digest to professionals listing parent invitations expiring within 4 days"
    cron: "0 8 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/expiry-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
