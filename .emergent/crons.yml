crons:
  - name: completion-nudge
    description: "Emails parents when their co-parent completes their half, and both parents when a Joint Report is ready"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/completion-nudge"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: expiry-digest
    description: "Daily 8am Central digest to professionals listing parent invitations expiring within 4 days, plus admin alert for professional invitations undelivered > 24h"
    cron: "0 8 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/expiry-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-summary
    description: "Monday 8am Central: caseload email to professionals, Judicial Portal digest to judges, and provider freshness check emailing admins on contact changes"
    cron: "0 8 * * 1"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: follow-up-reminder
    description: "Daily 8am Central: professional follow-up/reassessment dates, plus a 7-day nudge to parents whose private safety screening is not yet received"
    cron: "0 8 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/follow-up-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: hearing-reminder
    description: "Daily 8am Central reminder to the professional and judge one week before a court hearing when the referral has not yet been submitted"
    cron: "0 8 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/hearing-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
